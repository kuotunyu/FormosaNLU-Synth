[project]
name = "formosanlu"
version = "1.2.1"
description = "Synthetic-data distillation for Traditional Chinese (Taiwan) spoken-language NLU."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "kuotunyu", email = "61350295+kuotunyu@users.noreply.github.com" },
]
dependencies = [
  "accelerate>=1.14,<2",
  "bitsandbytes>=0.50,<0.51",
  "datasets>=4.0,<5",
  "httpx>=0.27,<1",
  "jsonlines>=4,<5",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "orjson>=3.10,<4",
  "pandas>=2.2,<4",
  "peft>=0.19,<0.20",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.10,<4",
  "requests>=2.32,<3",
  "sacremoses>=0.1,<0.2",
  "scikit-learn>=1.6,<2",
  "seaborn>=0.13,<1",
  "sentencepiece>=0.2,<0.3",
  "sentence-transformers>=5.6,<6",
  "torch>=2.11,<2.12",
  "tqdm>=4.66,<5",
  "transformers>=5.5,<6",
  "trl>=1.9,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
demo = [
  "gradio>=6.0,<7",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "requires_local_artifacts: requires ignored local datasets or generated artifacts",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
