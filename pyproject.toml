[project]
name = "formosanlu"
version = "0.1.0"
description = "Synthetic-data distillation for Traditional Chinese (Taiwan) spoken-language NLU."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "kuotunyu", email = "61350295+kuotunyu@users.noreply.github.com" },
]
dependencies = [
  "datasets>=4.0,<5",
  "httpx>=0.27,<1",
  "jsonlines>=4,<5",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "orjson>=3.10,<4",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "pyyaml>=6.0,<7",
  "rapidfuzz>=3.10,<4",
  "requests>=2.32,<3",
  "scikit-learn>=1.6,<2",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5",
  "typer>=0.15,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
line-ending = "lf"
